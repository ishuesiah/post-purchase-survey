# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "90aa57a04a89523207a86532f823bbd6"
application_url = "https://post-purchase-survey-7g5op.sevalla.app"
embedded = true
name = "post-purchase-survey"

[access_scopes]
# read_orders/write_orders: fetch the order email at sync time and upsert
# the survey.* order metafields.
scopes = "read_orders,write_orders"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Flushes pending Thank-you page answers the moment the order exists.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  # No customer PII is stored by this app; handlers are mostly no-ops.
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/compliance"
  customer_deletion_url = "/webhooks/compliance"
  shop_deletion_url = "/webhooks/compliance"

[auth]
redirect_urls = [ "https://post-purchase-survey-7g5op.sevalla.app/api/auth" ]

[build]
automatically_update_urls_on_dev = true
